<!DOCTYPE html>
<html>
<head>
    <title>TeroMeh</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
  <body>

<header>
  <div class="logo-row">
    <img src="favicon.svg" alt="Logo" width="28" height="28">
    <span class="logo-name">TeroMeh</span>
    <a href="mailto:teromeh@proton.me" class="btn-contact" aria-label="Email">
      <i class="bi bi-envelope"></i>
    </a>
  </div>
</header>

    <section class="projects">
      <div class="grid">
        <a href="projects/my-workout-data" class="card">
          <div class="card-img">
            <img src="images/workout-data.jpg" alt="Workout data preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>My workout data</h3>
          </div>
        </a>

        <a href="projects/helsinki-public-transport" class="card">
          <div class="card-img">
            <img src="images/helsinki-public-transport.jpg" alt="Helsinki public transport preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>Helsinki public transport</h3>
          </div>
        </a>

        <a href="projects/helsinki-city-bikes" class="card">
          <div class="card-img">
            <img src="images/helsinki-city-bikes.jpg" alt="Helsinki city bikes preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>Helsinki city bikes usage</h3>
          </div>
        </a>
        
        <a href="projects/helsinki-weather-history" class="card">
          <div class="card-img">
            <img src="images/helsinki-weather-history.jpg" alt="Helsinki weather history preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>Helsinki weather history</h3>
          </div>
        </a>
        
        <a href="projects/fi-municipalities-population-trends" class="card">
          <div class="card-img">
            <img src="images/fi-municipalities.jpg" alt="FI municipalities preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>FI municipalities - Population trends</h3>
          </div>
        </a>
        
        <a href="projects/ess-11-trust" class="card">
          <div class="card-img">
            <img src="images/ess.jpg" alt="ESS round 11 preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>The European Social survey - Trust</h3>
          </div>
        </a>
        
        <a href="projects/kuntavaalit-2025" class="card">
          <div class="card-img">
            <img src="images/vaalit.jpg" alt="Kuntavaalit 2025 preview" loading="lazy">
          </div>
          <div class="card-text">
            <h3>Kuntavaalit 2025</h3>
          </div>
        </a>
        
      </div>
    </section>

  </body>
</html>
